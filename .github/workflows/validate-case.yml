name: Validate interview case

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: case-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile all modules
        run: mvn -B -ntp -DskipTests package

      - name: Test changed case modules
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mapfile -t modules < <(
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" |
              awk -F/ '/^case-[0-9][0-9]-/ { print $1 }' |
              sort -u
          )

          if [ ${#modules[@]} -eq 0 ]; then
            echo "Ingen case-moduler er endret."
            exit 0
          fi

          for module in "${modules[@]}"; do
            echo "Tester $module"
            mvn -B -ntp test -pl "$module"
          done
