# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "sopra-kotlin-interview-cases"

[setup]
script = ""

[setup.darwin]
script = "./mvnw -q -DskipTests dependency:go-offline"

[[actions]]
name = "Test active case"
icon = "test"
command = '''
branch="$(git branch --show-current)"
case_number="$(printf '%s\n' "$branch" |
  sed -nE 's/^case-([0-9]{2})-forsoek-[0-9]+$/\1/p')"

if [ -z "$case_number" ]; then
  echo "Ugyldig branch: $branch"
  echo "Forventet format: case-NN-forsoek-M"
  exit 2
fi

module="$(find . -maxdepth 1 -type d \
  -name "case-${case_number}-*" -print -quit)"

if [ -z "$module" ]; then
  echo "Fant ingen modul for case $case_number"
  exit 2
fi

module="${module#./}"
echo "Kjører for: $module"

./mvnw -pl "$module" test'''
platform = "darwin"

